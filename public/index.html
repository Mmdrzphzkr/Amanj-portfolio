<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f0f23" />
  <meta name="description" content="Amanj Devs - Professional Web & App Development Team. We build websites, applications, and trading bots." />
  <meta name="keywords" content="web development, app development, trading bots, React, Next.js, .NET, Python, Amanj Devs" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Amanj Devs | Web & App Development</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f23; overflow-x: hidden; }
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f0f23; display: flex; align-items: center;
      justify-content: center; z-index: 99999; flex-direction: column;
    }
    .loader-ring {
      width: 80px; height: 80px; border: 3px solid transparent;
      border-top: 3px solid #6c63ff; border-right: 3px solid #00ff88;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    .loader-text {
      color: #6c63ff; font-family: 'Orbitron', sans-serif;
      margin-top: 20px; font-size: 14px; letter-spacing: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader-ring"></div>
    <div class="loader-text">LOADING</div>
  </div>
  <div id="root"></div>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.transition = 'opacity 0.5s';
          loader.style.opacity = '0';
          setTimeout(function() { loader.style.display = 'none'; }, 500);
        }
      }, 1500);
    });
  </script>
</body>
</html>
